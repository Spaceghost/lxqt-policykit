name: Consolidate authentication branch aliases
on:
  push:
    branches: [validation/retry-authentication]
    paths: [.github/workflows/consolidate-retry-branches.yml]
permissions:
  contents: read
jobs:
  prune:
    if: github.repository == 'Spaceghost/lxqt-policykit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify reachability and delete only the obsolete refs
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True, timeout=60).strip()

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def remote_refs():
              return {ref: sha for sha, ref in
                      (line.split() for line in git('ls-remote', '--heads', 'origin').splitlines())}

          target = 'refs/heads/validation/retry-authentication'
          pr = 'refs/heads/retry-authentication'
          pr_sha = '1d0eb3feb688318855d4a754f78aa4ea6aa4cd97'
          candidate = '3a517897aaa1c71f1554b7bf50da7ac807c06489'
          obsolete = {
              'refs/heads/retry-authentication-cancel': candidate,
              'refs/heads/validation/native-identity-guard': candidate,
              'refs/heads/validation/retry-authentication-cancel':
                  '2c63e1ceea9c9f29a5a445ac92487bbd925d3e2e',
          }
          require(os.environ['GITHUB_REF'] == target, 'Wrong cleanup branch')
          require(git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA'], 'Unexpected checkout')
          require(Path('test/production-revision').read_text().strip() == candidate,
                  'Production candidate changed')
          before = remote_refs()
          require(before.get(target) == os.environ['GITHUB_SHA'], 'Validation branch moved')
          require(before.get(pr) == pr_sha, 'PR branch moved')
          require(not git('diff', candidate, 'HEAD', '--', 'src', 'CMakeLists.txt',
                          'autostart', 'translations'), 'Production sources differ')
          for sha in set(obsolete.values()):
              git('merge-base', '--is-ancestor', sha, 'HEAD')
          for sha in ('aab7234ca7d0092cdf6e9afde6baab70519cbafc',
                      '9cf457fa7ad6c08faf23f24bc7f0a9069421d53d'):
              git('merge-base', '--is-ancestor', sha, 'HEAD')

          pending = {ref: sha for ref, sha in obsolete.items() if ref in before}
          for ref, sha in pending.items():
              require(before[ref] == sha, f'Ref changed; refusing to delete {ref}')
          if pending:
              # Explicit leases protect against writes after the preflight read.
              # Atomic push prevents partial deletion if any lease is rejected.
              args = ['git', 'push', '--atomic']
              args += [f'--force-with-lease={ref}:{sha}' for ref, sha in pending.items()]
              args += ['origin'] + [f':{ref}' for ref in pending]
              subprocess.run(args, check=True, timeout=60)
          after = remote_refs()
          expected = {ref: sha for ref, sha in before.items() if ref not in obsolete}
          require(after == expected, 'Unexpected remote branch state after cleanup')
          require(after.get(pr) == pr_sha, 'PR branch must remain unchanged')
          print('Kept retry-authentication and validation/retry-authentication.')
          print('Removed only the three superseded authentication aliases.')
          print('Master, release branches, production code, and validation history are unchanged.')
          PY
