name: Retry completion regression
on:
  push:
    branches: [validation/retry-authentication-cancel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Install build and test dependencies
        run: |
          dnf install -y git gcc-c++ clang cmake ninja-build python3 \
            qt6-qtbase-devel qt6-qttools-devel polkit-devel polkit-qt6-1-devel \
            liblxqt-devel kf6-kwindowsystem-devel libasan libubsan > /tmp/dependencies.log 2>&1 \
            || { tail -n 80 /tmp/dependencies.log; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the clean production snapshot
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code \
            b8b412fcb1696491f7554ceb2d5891c543a76ae0 -- \
            src CMakeLists.txt autostart translations
      - name: Build the complete application
        run: |
          { cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUPDATE_TRANSLATIONS=OFF \
            && cmake --build build --parallel 2; } > /tmp/application-build.log 2>&1 \
            || { tail -n 80 /tmp/application-build.log; exit 1; }
          tail -n 5 /tmp/application-build.log
      - name: Test full agent with GCC and Clang
        run: |
          python3 test/test_retry_completion.py > /tmp/gcc-tests.log 2>&1 \
            || { tail -n 100 /tmp/gcc-tests.log; exit 1; }
          grep -E 'review_|100% tests passed' /tmp/gcc-tests.log
          CXX=clang++ python3 test/test_retry_completion.py > /tmp/clang-tests.log 2>&1 \
            || { tail -n 100 /tmp/clang-tests.log; exit 1; }
          tail -n 4 /tmp/clang-tests.log
      - name: Test with address and undefined-behavior sanitizers
        run: |
          python3 test/test_retry_completion.py --sanitize > /tmp/sanitizer-tests.log 2>&1 \
            || { tail -n 100 /tmp/sanitizer-tests.log; exit 1; }
          tail -n 4 /tmp/sanitizer-tests.log
      - name: Verify regressions and mutations fail at runtime
        run: |
          python3 test/lifecycle/check_regressions.py > /tmp/negative-controls.log 2>&1 \
            || { tail -n 100 /tmp/negative-controls.log; exit 1; }
          grep 'REJECTED at runtime:' /tmp/negative-controls.log
