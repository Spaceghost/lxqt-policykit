name: Retry completion regression

on:
  push:
    branches: [retry-authentication-cancel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Qt test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qt6-base-dev pkg-config
      - name: Check completion control flow with GCC and Clang
        run: |
          python3 test/test_retry_completion.py
          CXX=clang++ python3 test/test_retry_completion.py
      - name: Check completion control flow with sanitizers
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: python3 test/test_retry_completion.py
      - name: Check actual Qt dialogs and guarded-pointer lifetimes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 test/test_retry_completion.py --qt
