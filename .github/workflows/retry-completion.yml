name: Retry completion regression
on:
  push:
    branches: [retry-authentication-cancel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Install build and test dependencies
        run: >-
          dnf install -y git gcc-c++ clang cmake ninja-build python3
          qt6-qtbase-devel qt6-qttools-devel polkit-devel polkit-qt6-1-devel
          liblxqt-devel libasan libubsan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build the complete application
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUPDATE_TRANSLATIONS=OFF
          cmake --build build --parallel 2
      - name: Test full agent with GCC and Clang
        run: |
          python3 test/test_retry_completion.py
          CXX=clang++ python3 test/test_retry_completion.py
      - name: Test with address and undefined-behavior sanitizers
        run: python3 test/test_retry_completion.py --sanitize
      - name: Verify regressions and mutations fail at runtime
        run: python3 test/lifecycle/check_regressions.py
